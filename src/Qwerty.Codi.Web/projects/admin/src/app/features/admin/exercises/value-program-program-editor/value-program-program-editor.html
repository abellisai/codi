@if (unavailable(); as message) {
  <p class="problem" role="alert">{{ message }}</p>
} @else {
  <div
    #workspaceHost
    class="workspace"
    role="application"
    [attr.aria-label]="
      readOnly() ? 'Progetto a blocchi in sola lettura' : 'Progetto a blocchi dell’esercizio'
    "
  ></div>
}

@if (problem(); as message) {
  <p class="problem" role="alert">{{ message }}</p>
}
